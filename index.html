<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エネルギー変換ダウト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* 縦画面を上下に割る。上半分は180度回して向かいの席へ。中央の帯に現在のエネルギー */
:root{
  --bg:#ecebe6; --panel:#ffffff; --fg:#1f2328; --muted:#5f656e; --line:#d3d0c8; --ok:#1f8a4c; --bad:#c62828;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141619;--panel:#22252a;--fg:#eceae6;--muted:#a3a8b0;--line:#3a3e45;--ok:#4cc27e;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141619;--panel:#22252a;--fg:#eceae6;--muted:#a3a8b0;--line:#3a3e45;--ok:#4cc27e;--bad:#ff8a80;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-disp);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:1fr auto 1fr}
.half{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px 16px;min-height:0;overflow:hidden}
.half.top{transform:rotate(180deg)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.en{font-weight:900;font-size:clamp(1.3rem,5vmin,2.2rem)}
.dot{display:inline-grid;place-items:center;border-radius:999px;color:#fff;font-weight:900;flex:none;width:1.6em;height:1.6em}
.prev{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85rem}
.prev svg{width:28px;height:auto}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;align-content:start;overflow:auto}
.cardbtn{padding:0;border:0;background:none;border-radius:8px;min-width:0}
.cardbtn svg{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.nm{display:block;margin-top:3px;font-size:.72rem;font-weight:700;line-height:1.2;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.prev .nm{display:inline;margin:0;font-size:.85rem}
.empty{color:var(--muted);font-size:1rem;align-self:center;margin:auto;text-align:center}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 11px;font-weight:700;font-size:.85rem}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.mid{height:10px;background:var(--line)}
.mid.on{background:var(--ecol)}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:14px;font-weight:900;font-size:clamp(1rem,4vmin,1.5rem);
  background:var(--panel);border:3px solid var(--bad);color:var(--bad);text-align:center;max-width:86%;z-index:5}
.toast.ok{border-color:var(--ok);color:var(--ok)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:10;overflow:auto;padding-inline:16px;padding-block:12px 20px}
.sheet .bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:0;background:var(--bg);padding-block:4px}
.sheet .bar span{color:var(--muted);font-size:.9rem;flex:1}
.sheet .grp{display:flex;align-items:center;gap:6px;margin:10px 0 6px;font-weight:900}
.sheet .grp .dot{width:1.4em;height:1.4em;font-size:.85rem}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="half top" id="hTop"></section>
  <div class="mid" id="mid"></div>
  <section class="half bot" id="hBot"></section>
</div>
<script src="icons.js"></script>
<script>
const E={"電気":["#d9a400","電"],"熱":["#d6452b","熱"],"光":["#ef8a1f","光"],"運動":["#2f6fd6","運"],"位置":["#2e9e5b","位"],"化学":["#8a4fc7","化"]};
const ORDER=["電気","化学","光","熱","運動","位置"];
const F='Zen Maru Gothic, Hiragino Maru Gothic ProN, Meiryo, sans-serif';
const CARDS=[["モーター","電気","運動",1],["電気自動車","電気","運動",1],["ホットプレート","電気","熱",1],["アイロン","電気","熱",1],
["蛍光灯","電気","光",1],["豆電球","電気","光",1],["LEDライト","電気","光",1],["エレベーター","電気","位置",2],["充電（二次電池）","電気","化学",2],
["乾電池","化学","電気",2],["燃料電池","化学","電気",1],["ガソリン自動車","化学","運動",1],["化学かいろ","化学","熱",1],["石油ストーブ","化学","熱",1],
["太陽光発電","光","電気",2],["光合成","光","化学",2],
["蒸気機関車","熱","運動",2],["火力発電","熱","電気",2],["地熱発電","熱","電気",1],
["発電機","運動","電気",2],["風力発電","運動","電気",2],["ブレーキ（摩擦）","運動","熱",2],
["水力発電（ダム）","位置","電気",2],["ジェットコースター","位置","運動",2]].map(([n,i,o,k])=>({n,i,o,k}));
const card=n=>CARDS.find(c=>c.n===n);
const en=e=>e+"エネ";
const dot=e=>`<span class="dot" style="background:${E[e][0]}">${E[e][1]}</span>`;
// 印刷したカードと同じ絵（名前の帯は省く。名前は絵の下に文字で出す）
const nm=c=>`<span class="nm">${c.n}</span>`;
let uid=0;
function art(c){
  const W=55,H=91,cy=43,r=14,id="a"+(uid++),i=c.i,o=c.o;
  const chip=(x,y,e,rr)=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="#fff"/><text x="${x}" y="${y+rr*.48}" font-size="${rr*1.25}" text-anchor="middle" font-family="${F}" font-weight="900" fill="${E[e][0]}">${E[e][1]}</text>`;
  return `<svg viewBox="0 4 55 74" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${c.n}">
   <defs><linearGradient id="${id}t" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${E[i][0]}" stop-opacity=".18"/><stop offset="1" stop-color="${E[o][0]}" stop-opacity=".18"/></linearGradient></defs>
   <rect y="4" width="${W}" height="74" fill="#fff"/>
   <rect x="23" y="${cy}" width="9" height="${74.5-cy}" rx="4.5" fill="${E[i][0]}"/>
   <rect x="23" y="16" width="9" height="${cy-16}" fill="${E[o][0]}"/>
   <path d="M15 24 L27.5 11.5 L40 24" stroke="${E[o][0]}" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <circle cx="27.5" cy="${cy}" r="${r}" fill="#fff"/><circle cx="27.5" cy="${cy}" r="${r}" fill="url(#${id}t)"/>
   <path d="M${27.5-r} ${cy} A${r} ${r} 0 0 0 ${27.5+r} ${cy}" fill="none" stroke="${E[i][0]}" stroke-width="3.2"/><path d="M${27.5-r} ${cy} A${r} ${r} 0 0 1 ${27.5+r} ${cy}" fill="none" stroke="${E[o][0]}" stroke-width="3.2"/>
   <g transform="translate(27.5 ${cy}) scale(1.05)">${ICONS[c.n]||""}</g>
   ${chip(27.5,64,i,2.6)}${chip(27.5,22,o,2.4)}</svg>`;
}

let hist=[], judge=false, toastT=0;
try{const s=JSON.parse(localStorage.getItem("hd3")||"null");if(s){hist=(s.hist||[]).filter(card);judge=!!s.judge;}}catch(e){}
const save=()=>{try{localStorage.setItem("hd3",JSON.stringify({hist,judge}))}catch(e){}};
const cur=()=>hist.length?card(hist[hist.length-1]).o:null;

function halfHTML(side){
  const now=cur(), last=hist.length?card(hist[hist.length-1]):null;
  const list=(!judge&&now)?CARDS.filter(c=>c.i===now):[];
  const head=now?`${dot(now)}<span class="en">${en(now)}</span>`:`<span class="en">最初は何でも</span>`;
  const prev=last?`<span class="prev">さっき ${art(last)}${nm(last)}</span>`:"";
  let body;
  if(list.length) body=`<div class="cards">${list.map(c=>`<button class="cardbtn" data-n="${c.n}" data-side="${side}">${art(c)}${nm(c)}</button>`).join("")}</div>`;
  else body=`<div class="cards"><p class="empty">${judge?"宣言されたカードを「判定する」から押す":"「カードを登録」から最初の1枚を押す"}</p></div>`;
  const ctl=`<div class="ctl"><button class="btn" data-a="sheet" data-side="${side}">${judge?"判定する":"カードを登録"}</button>
    <button class="btn" data-a="undo">1枚もどす</button><button class="btn" data-a="reset">最初から</button>
    <button class="btn" data-a="judge" data-side="${side}" aria-pressed="${judge}">判定機モード</button></div>`;
  return `<div class="head">${head}${prev}</div>${body}${ctl}`;
}
function render(){
  document.getElementById("hTop").innerHTML=halfHTML("top");
  document.getElementById("hBot").innerHTML=halfHTML("bot");
  const now=cur(), m=document.getElementById("mid");
  m.classList.toggle("on",!!now); if(now) m.style.setProperty("--ecol",E[now][0]);
}
function toast(side,msg,ok){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div");t.className="toast"+(ok?" ok":"");t.innerHTML=msg;
  document.getElementById(side==="top"?"hTop":"hBot").appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),ok?1400:3500);
}
function declare(n,side){
  const c=card(n),now=cur();
  if(now&&c.i!==now){toast(side,`変換失敗<br><small>${c.n}は${en(c.i)}から。いまは${en(now)}</small>`,false);return;}
  hist.push(n);save();render();
  if(judge)toast(side,`OK<br><small>${c.n}：${en(c.i)} → ${en(c.o)}</small>`,true);
}
function openSheet(side){
  const host=document.getElementById(side==="top"?"hTop":"hBot");
  const sh=document.createElement("div");sh.className="sheet";
  sh.innerHTML=`<div class="bar"><span>${cur()?`いまは${en(cur())}`:"最初の1枚は何でも"}</span><button class="btn" data-a="close">とじる</button></div>`+
    ORDER.map(e=>`<div class="grp">${dot(e)}${en(e)}から</div><div class="cards">`+CARDS.filter(c=>c.i===e).map(c=>`<button class="cardbtn" data-n="${c.n}" data-side="${side}" data-sheet="1">${art(c)}${nm(c)}</button>`).join("")+`</div>`).join("");
  host.appendChild(sh);
}
document.getElementById("app").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.a==="close"){b.closest(".sheet").remove();return;}
  if(b.dataset.n){const sh=b.closest(".sheet");if(sh)sh.remove();declare(b.dataset.n,b.dataset.side);return;}
  const a=b.dataset.a, side=b.dataset.side;
  if(a==="undo"){hist.pop();save();render();}
  else if(a==="reset"){hist=[];save();render();}
  else if(a==="judge"){judge=!judge;save();render();}
  else if(a==="sheet"){openSheet(side);}
});
render();
</script>
</body>
</html>
